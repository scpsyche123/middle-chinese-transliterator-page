name: Publish standalone page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-standalone.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch revised standalone page
        run: |
          curl -fL "https://raw.githubusercontent.com/scpsyche123/middle-chinese-transliterator/main/app/openpage/revised.html" -o index.html
          test -s index.html
      - name: Commit published page
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish revised standalone page"
          git push
