"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f2981c25-1630-4d2a-b883-1a74be98a650\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>IPA → Middle Chinese Transliterator<\u002Ftitle>\n<style>/* Broadsheet — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"dd8f17b7-55b8-46bc-91b6-ca2d6a9cf152\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"anonymous\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&amp;family=Charis+SIL:ital,wght@0,400;0,700;1,400&amp;display=swap\">\n<script src=\"c8d58e41-cac0-43d1-bb96-e558cf76b003\"><\u002Fscript>\n\n\n\n\n<style>\n:root {\n  --font-cjk: \"Noto Serif TC\", \"Source Han Serif TC\", \"Noto Serif CJK TC\", \"Songti TC\", \"Plangothic P1\", \"Plangothic P2\", \"HanaMinB\", \"MingLiU-ExtB\", \"SimSun-ExtB\", serif;\n  --font-ipa: \"Charis SIL\", \"Gentium Plus\", \"Doulos SIL\", \"Gentium Book Plus\", \"Times New Roman\", serif;\n}\nbody { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\na { color: var(--color-accent-700); text-underline-offset: 3px; }\na:hover { color: var(--color-accent-800); }\ninput[type=\"range\"] { accent-color: var(--color-accent); }\n.ipa-input {\n  width: 100%; box-sizing: border-box; margin: 0;\n  font-family: var(--font-ipa); font-size: clamp(26px, 4vw, 40px); line-height: 1.3;\n  color: var(--color-text); caret-color: var(--color-accent);\n  padding: 14px 20px 14px clamp(52px, 6vw, 64px);\n  background: var(--color-neutral-100);\n  border: 1.5px solid color-mix(in srgb, var(--color-text) 55%, transparent);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-sm);\n  outline: none; cursor: text;\n  transition: border-color 0.15s ease, box-shadow 0.15s ease;\n}\n.ipa-input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n.ipa-input:hover { border-color: color-mix(in srgb, var(--color-text) 80%, transparent); }\n.ipa-input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-200); }\n.ipa-field:focus-within .ipa-icon { color: var(--color-accent-700); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 1120px; margin: 0 auto; padding: clamp(28px, 5vw, 64px) clamp(18px, 5vw, 56px) 120px;\">\n\n  <header style=\"display: flex; flex-direction: column; gap: var(--space-4); margin-bottom: clamp(40px, 6vw, 72px);\">\n    <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"height: 4px; background: var(--color-text);\"><\u002Fdiv>\n      <div style=\"height: 1px; background: var(--color-text);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"margin: var(--space-3) 0 0; max-width: 16ch; font-family: var(--font-heading); font-weight: 600; font-size: clamp(38px, 6.4vw, 72px); line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance;\">IPA → Middle Chinese transliteration<\u002Fh1>\n    <p style=\"margin: 0; max-width: 58ch; font-size: clamp(17px, 1.8vw, 20px); line-height: 1.55; color: var(--color-neutral-700); text-wrap: pretty;\">Enter a pronunciation in IPA. The tool finds the closest syllables in this project's reconstruction of Middle Chinese and writes them out in characters. Only the sound counts: source spelling, etymology, and known character identities play no part.<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"display: flex; flex-direction: column; gap: var(--space-6); margin-bottom: clamp(48px, 7vw, 88px);\">\n    <div style=\"display: flex; flex-direction: column; gap: var(--space-2); max-width: 720px;\">\n      <label for=\"ipa-in\" style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700);\">IPA input<\u002Flabel>\n      <div class=\"ipa-field\" style=\"position: relative;\">\n        <svg class=\"ipa-icon\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" style=\"position: absolute; left: clamp(16px, 2vw, 22px); top: 50%; transform: translateY(-50%); width: clamp(22px, 2.6vw, 28px); height: clamp(22px, 2.6vw, 28px); color: var(--color-neutral-600); pointer-events: none; transition: color 0.15s ease;\"><path d=\"M221.66,90.34,192,120,136,64l29.66-29.66a8,8,0,0,1,11.31,0L221.66,79A8,8,0,0,1,221.66,90.34Z\" opacity=\"0.2\"><\u002Fpath><path d=\"M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z\"><\u002Fpath><\u002Fsvg>\n        <input id=\"ipa-in\" class=\"ipa-input\" type=\"text\" spellcheck=\"false\" autocomplete=\"off\" placeholder=\"Type or paste IPA, e.g. paʁi\" aria-describedby=\"ipa-hint\" value=\"{{ ipa }}\" sc-camel-on-change=\"{{ onInput }}\">\n      <\u002Fdiv>\n      <p id=\"ipa-hint\" style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">The result below changes as you type.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n      <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700);\">Or try an example<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); margin-left: -8px;\">\n        <sc-for list=\"{{ examples }}\" as=\"ex\" hint-placeholder-count=\"8\">\n          <button class=\"btn btn-ghost\" type=\"button\" sc-camel-on-click=\"{{ ex.onPick }}\" style=\"padding: 6px 8px; font-size: 15px; color: var(--color-text); display: inline-flex; gap: 7px; align-items: baseline; white-space: nowrap; flex: none;\"><span style=\"font-weight: 600; color: var(--color-accent-700);\">{{ ex.name }}<\u002Fspan><span style=\"font-family: var(--font-ipa); font-weight: 400; color: var(--color-neutral-600);\">{{ ex.ipa }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ hasResult }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); margin-bottom: clamp(48px, 7vw, 88px);\">\n      <div style=\"font-family: var(--font-cjk); font-weight: 600; font-size: clamp(64px, 13vw, 140px); line-height: 1.05; letter-spacing: 0.04em;\">{{ name }}<\u002Fdiv>\n      <div style=\"font-family: var(--font-ipa); font-size: clamp(18px, 2.6vw, 24px); color: var(--color-neutral-700); letter-spacing: 0.01em;\">{{ readingLine }}<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; padding-top: var(--space-2);\">\n        <span style=\"{{ totalChipStyle }}\">{{ totalText }}<\u002Fspan>\n        <span style=\"font-size: 14px; font-style: italic; color: var(--color-neutral-700);\">{{ perCharText }}　·　Lower is closer; 0 = exact match<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; margin-bottom: clamp(56px, 8vw, 104px);\">\n      <h2 style=\"margin: 0 0 var(--space-2); font-family: var(--font-heading); font-weight: 600; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.015em;\">Syllables<\u002Fh2>\n      <div aria-label=\"Legend for the Alternatives column\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-6); margin: 0 0 var(--space-6); font-size: 14px; line-height: 1.4; color: var(--color-neutral-700);\">\n        <div style=\"display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 30px; min-height: 30px; padding: 0 6px; box-sizing: border-box; font-family: var(--font-cjk); font-size: 16px; line-height: 1; border-radius: var(--radius-md); background: var(--color-accent); color: var(--color-bg); border: 1px solid var(--color-accent);\">巴<\u002Fspan><span>Character in use<\u002Fspan><\u002Fdiv>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 30px; min-height: 30px; padding: 0 6px; box-sizing: border-box; font-family: var(--font-cjk); font-size: 16px; line-height: 1; border-radius: var(--radius-md); background: transparent; color: var(--color-text); border: 1px solid var(--color-neutral-300);\">巴<\u002Fspan><span>Same phonological group; click to use it instead<\u002Fspan><\u002Fdiv>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 30px; min-height: 30px; padding: 0 6px; box-sizing: border-box; font-family: var(--font-cjk); font-size: 16px; line-height: 1; border-radius: var(--radius-md); background: transparent; color: var(--color-text); border: 1px solid var(--color-neutral-300);\">巴<span style=\"position: absolute; top: -5px; right: -4px; font-size: 10px; line-height: 1; color: var(--color-accent-2-700);\">✗<\u002Fspan><\u002Fspan><span><span style=\"color: var(--color-accent-2-700);\">✗<\u002Fspan> Main Mandarin reading does not fit this group; still usable, ranked lower<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ headerStyle }}\">\n        <div>Source<\u002Fdiv>\n        <div>Target<\u002Fdiv>\n        <div>Character<\u002Fdiv>\n        <div>Distance<\u002Fdiv>\n        <div>Alternatives<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ syls }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"{{ s.rowStyle }}\">\n          <div style=\"font-family: var(--font-ipa); font-size: 20px; white-space: nowrap;\">{{ s.src }}<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 8px; white-space: nowrap;\"><span style=\"color: var(--color-neutral-500);\">→<\u002Fspan><span style=\"font-family: var(--font-ipa); font-size: 20px;\">{{ s.target }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 6px;\"><span style=\"font-family: var(--font-cjk); font-weight: 600; font-size: 32px; line-height: 1;\">{{ s.char }}<\u002Fspan><span title=\"Historical tone category; not used in matching\" style=\"font-family: var(--font-cjk); font-size: 11px; line-height: 1; white-space: nowrap; color: var(--color-neutral-700);\">{{ s.tone }}<\u002Fspan><\u002Fdiv>\n          <div><span style=\"{{ s.chipStyle }}\">{{ s.dText }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 4px; align-items: center;\">\n            <sc-for list=\"{{ s.alts }}\" as=\"alt\" hint-placeholder-count=\"6\">\n              <button type=\"button\" sc-camel-on-click=\"{{ alt.onPick }}\" title=\"{{ alt.title }}\" style=\"{{ alt.style }}\" style-hover=\"border-color: var(--color-accent);\">{{ alt.ch }}<span style=\"{{ alt.markStyle }}\">{{ alt.mark }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ loadError }}\" hint-placeholder-val=\"\">\n    <section style=\"padding: var(--space-4) 0; margin-bottom: var(--space-8); font-size: 16px; line-height: 1.6; color: var(--color-accent-2-700);\">{{ loadError }}<\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"display: flex; flex-direction: column; gap: clamp(40px, 6vw, 64px); padding-top: var(--space-6);\">\n    <section style=\"display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-8);\">\n      <h2 style=\"margin: 0; flex: 0 1 240px; font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em;\">Limitations<\u002Fh2>\n      <div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: var(--space-6); max-width: 70ch;\">\n      <ul style=\"margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: var(--space-3); max-width: 70ch; font-size: 16px; line-height: 1.65; color: var(--color-neutral-800); text-wrap: pretty;\">\n        <li>The target phonology is a reconstruction. It follows Li Rong's system, with some changes made for this project, so its phonetic values are analytical choices and not recorded speech.<\u002Fli>\n        <li>Tone is not modeled. Source-language tone adds nothing to the score. The Middle Chinese tone categories <span style=\"font-family: var(--font-cjk);\">平<\u002Fspan> (level), <span style=\"font-family: var(--font-cjk);\">上<\u002Fspan> (rising), <span style=\"font-family: var(--font-cjk);\">去<\u002Fspan> (departing), and <span style=\"font-family: var(--font-cjk);\">入<\u002Fspan> (entering) appear next to output characters as historical information only.<\u002Fli>\n        <li>Epenthetic vowels are approximate. When a consonant cluster has to be split, the inserted vowel copies a nearby source vowel: the next one, or the previous one if none follows. Historical transcriptions often did the same, but the vowel itself is not in the source.<\u002Fli>\n        <li>Some source contrasts have no counterpart in the target. Clicks, pharyngealization, uvular contrasts, voiceless laterals, and palatalized consonant sequences can only be approximated, by mapping to a nearby target category and adding a penalty.<\u002Fli>\n        <li>Transliteration works from sound alone. Known Chinese-character readings, and the identity of characters in the source, are ignored. Japanese, Korean, Vietnamese, Modern Standard Mandarin, other Sinitic varieties, and other languages with a Chinese-character tradition go through IPA exactly like any other input. The system does not try to recover their original characters or give them any preference.<\u002Fli>\n        <li>Input must be IPA. Converting ordinary spelling to IPA is deliberately left out of this page.<\u002Fli>\n      <\u002Ful>\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-3); font-size: 16px; line-height: 1.65; color: var(--color-neutral-800); text-wrap: pretty;\">\n          <h3 style=\"margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 19px; line-height: 1.3; color: var(--color-text);\">Information not currently modeled<\u002Fh3>\n          <p style=\"margin: 0;\">Tone, stress, vowel length, and vowel nasalization are dropped before scoring. None of them is mapped onto a Middle Chinese contrast. For tone this covers both contour systems and level/register systems.<\u002Fp>\n          <p style=\"margin: 0;\">Many other IPA modifiers still count. Aspiration is treated as a consonant feature, and several secondary articulations add to the distance. Dropping these four properties does not mean that IPA diacritics are ignored across the board.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-8);\">\n      <h2 style=\"margin: 0; flex: 0 1 240px; font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em;\">Next step: parameter calibration<\u002Fh2>\n      <p style=\"margin: 0; flex: 1 1 440px; max-width: 70ch; font-size: 16px; line-height: 1.65; color: var(--color-neutral-800); text-wrap: pretty;\">The distance weights were set by hand. They were not learned by training a model or fitted statistically. The next step is to tune them systematically against correspondences in historical transcriptions. So far only two settings have been adjusted on historical evidence: the voicing weight and the comparison between laterals and fricatives. The evidence includes <span style=\"font-family: var(--font-cjk);\">邏些<\u002Fspan> (Lhasa), <span style=\"font-family: var(--font-cjk);\">娑羅<\u002Fspan> (Sara), <span style=\"font-family: var(--font-cjk);\">娑羅誐<\u002Fspan> (Sarag), and <span style=\"font-family: var(--font-cjk);\">回鶻<\u002Fspan> (Uyghur).<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-8);\">\n      <h2 style=\"margin: 0; flex: 0 1 240px; font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em;\">Character selection<\u002Fh2>\n      <div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: var(--space-3); max-width: 70ch; font-size: 16px; line-height: 1.65; color: var(--color-neutral-800); text-wrap: pretty;\">\n        <p style=\"margin: 0;\">Sound comes first. The system finds the closest Middle Chinese phonological match, which settles a tone-independent phonological group, and then picks a character from that group. Character preferences never outweigh a closer phonological match. They only break ties between mappings that score equally well.<\u002Fp>\n        <p style=\"margin: 0;\">Inside a group, characters excluded by hand and characters with no frequency data are removed first. The rest are ranked mainly by corpus frequency. Characters above a frequency threshold get an extra boost if they are common in historical or modern Chinese transcriptions, or if they have <span style=\"font-family: var(--font-cjk);\">口<\u002Fspan> on the left. These boosts change which character is written, not the phonological distance.<\u002Fp>\n        <p style=\"margin: 0;\">Each group has a default character. Some defaults were picked by hand. Others were corrected automatically using modern readings: a candidate's main Mandarin reading is compared with the modern reading expected from the other characters in the same <em>Guangyun<\u002Fem> xiaoyun. Mandarin is only a check on which character is shown. It never enters the Middle Chinese distance calculation.<\u002Fp>\n        <p style=\"margin: 0;\">A <span style=\"color: var(--color-accent-2-700);\">✗<\u002Fspan> next to an alternative means its main Mandarin reading clearly does not match what the group predicts. The character still belongs to the group and can still be chosen, but it ranks below alternatives with better support.<\u002Fp>\n        <p style=\"margin: 0;\">Every alternative listed for a syllable belongs to the same phonological group. Picking a different one changes the written form, and possibly the historical tone category, but not the target pronunciation used in the transliteration.<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: var(--color-neutral-700);\">In the current implementation, defaults that were not set by hand are chosen by frequency, after unsuitable and zero-frequency characters are excluded. Above a frequency floor of 200, established transliteration characters get a ×8 multiplier, characters with <span style=\"font-family: var(--font-cjk);\">口<\u002Fspan> on the left get ×1.5, and all others get ×1. These numbers are settings in the code. They make no claim about how much those properties matter linguistically.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-8);\">\n      <h2 style=\"margin: 0; flex: 0 1 240px; font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em;\">How the algorithm works<\u002Fh2>\n      <div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: var(--space-4); max-width: 70ch;\">\n        <ol style=\"margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: var(--space-3); font-size: 16px; line-height: 1.65; color: var(--color-neutral-800); text-wrap: pretty;\">\n          <li>The input is split into IPA segments, and several possible syllabifications are generated.<\u002Fli>\n          <li>Each source syllable is compared with Middle Chinese target syllables using feature distances: place, manner, voicing, and aspiration for consonants; height, backness, and rounding for vowels; and differences in medial and coda. Unsupported features, deleted segments, and inserted vowels add explicit penalties.<\u002Fli>\n          <li>The search scores the whole input at once and keeps the path with the lowest total cost. It does not choose greedily, segment by segment.<\u002Fli>\n          <li>Each target syllable is mapped to a tone-independent phonological group, and a character is taken from that group's ranked list. Tone plays no part in the phonological match.<\u002Fli>\n          <li>The page shows the character string, the reconstructed target IPA, the mapping for each syllable, alternative characters, and distance values.<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst EXAMPLES = [\n  { name: 'Mong Kok', ipa: 'mɔŋkɔk' },\n  { name: 'Phuket', ipa: 'pʰuket' },\n  { name: 'Paris', ipa: 'paʁi' },\n  { name: 'Strauss', ipa: 'ʃtʁaus' },\n  { name: 'Berlin', ipa: 'bɛʁlin' },\n  { name: 'Moscow', ipa: 'moskva' },\n  { name: 'Tokyo', ipa: 'tokjo' },\n  { name: 'Beijing', ipa: 'peɪtɕiŋ' },\n  { name: 'Lhasa', ipa: 'l̥asa' },\n  { name: 'Khoekhoe', ipa: 'ǀaisa' },\n  { name: 'Tenochtitlan', ipa: 'tenotʃtitɬan' },\n  { name: 'Barcelona', ipa: 'baɾθelona' },\n  { name: 'Alexandria', ipa: 'ʔiskəndərijja' },\n  { name: 'São Paulo', ipa: 'sanpauɫu' },\n  { name: 'Da Nang', ipa: 'ɗanaŋ' },\n  { name: 'Khartoum', ipa: 'kʰartʰum' },\n];\n\nconst TONE_GLOSS = { '平': '平 (level)', '上': '上 (rising)', '去': '去 (departing)', '入': '入 (entering)' };\n\nconst COLS = '140px minmax(120px, 1fr) 100px 84px minmax(0, 1.5fr)';\n\nclass Component extends DCLogic {\n  state = { ipa: 'paʁi', ready: false, loadError: '', overrides: {}, wide: true };\n\n  componentDidMount() {\n    this._onResize = () => {\n      const wide = window.innerWidth >= 760;\n      if (wide !== this.state.wide) this.setState({ wide });\n    };\n    window.addEventListener('resize', this._onResize);\n    this.setState({ wide: window.innerWidth >= 760 });\n    this.load();\n  }\n\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n\n  async load() {\n    try {\n      for (let i = 0; i < 100 && !window.MCTranslit; i++) await new Promise((r) => setTimeout(r, 50));\n      if (!window.MCTranslit) throw new Error('translit.js did not load');\n      const get = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u + ' → ' + r.status); return r.json(); });\n      const res = window.__resources || {};\n      const [d, f, p] = await Promise.all([\n        get(res.engineData || 'data/engine-data.json'),\n        get(res.featuresJson || 'data/features.json'),\n        get(res.poolsJson || 'data/pools.json'),\n      ]);\n      this.eng = new window.MCTranslit.Engine(d, f, p);\n      this.setState({ ready: true });\n    } catch (e) {\n      this.setState({ loadError: 'Could not load data: ' + (e && e.message ? e.message : e) });\n    }\n  }\n\n  setIpa(v) { this.setState({ ipa: v, overrides: {} }); }\n\n  result() {\n    if (!this.eng || !this.state.ipa.trim()) return null;\n    if (this._sig !== this.state.ipa) {\n      try { this._res = this.eng.translit(this.state.ipa); } catch (e) { this._res = null; }\n      this._sig = this.state.ipa;\n    }\n    return this._res;\n  }\n\n  band(d) {\n    if (d <= 0.5) return 'background: var(--color-accent-100); color: var(--color-accent-800);';\n    if (d <= 1.5) return 'background: var(--color-accent-300); color: var(--color-accent-900);';\n    return 'background: var(--color-accent-700); color: var(--color-neutral-100);';\n  }\n\n  chip(d) {\n    return this.band(d)\n      + ' display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--radius-md);'\n      + ' font-family: var(--font-body); font-size: 14px; font-variant-numeric: tabular-nums lining-nums;';\n  }\n\n  renderVals() {\n    const st = this.state;\n    const res = this.result();\n    const maxAlts = 12;\n    const rule = ' border-bottom: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent);';\n\n    const rowStyle = st.wide\n      ? 'display: grid; grid-template-columns: ' + COLS + '; gap: var(--space-2) var(--space-4); align-items: center; padding: var(--space-4) 0;' + rule\n      : 'display: grid; grid-template-columns: 1fr; gap: var(--space-2); align-items: start; padding: var(--space-4) 0;' + rule;\n\n    const syls = (res ? res.syllables : []).map((s, i) => {\n      const ch = st.overrides[i] || s.char;\n      const picked = s.pool.find((a) => a.c === ch);\n      const alts = s.pool.slice(0, maxAlts).map((a) => ({\n        ch: a.c,\n        title: TONE_GLOSS[a.t] || a.t,\n        mark: a.m === '✗' ? '✗' : '',\n        markStyle: 'position: absolute; top: -5px; right: -4px; font-size: 10px; line-height: 1; pointer-events: none; '\n          + (a.c === ch ? 'color: var(--color-accent-2-700);' : 'color: var(--color-accent-2-700);'),\n        style: 'position: relative; min-width: 36px; min-height: 36px; padding: 0 7px; cursor: pointer; font-family: var(--font-cjk); font-size: 18px; line-height: 1; border-radius: var(--radius-md); '\n          + (a.c === ch\n            ? 'background: var(--color-accent); color: var(--color-bg); border: 1px solid var(--color-accent);'\n            : 'background: transparent; color: var(--color-text); border: 1px solid var(--color-neutral-300);'),\n        onPick: () => this.setState({ overrides: { ...this.state.overrides, [i]: a.c } }),\n      }));\n      const tone = picked ? picked.t : s.tone;\n      return {\n        src: s.src || '(zero onset)',\n        target: s.target,\n        tone: TONE_GLOSS[tone] || tone,\n        char: ch,\n        dText: s.dist.toFixed(2),\n        chipStyle: this.chip(s.dist),\n        rowStyle,\n        alts,\n      };\n    });\n\n    const n = syls.length || 1;\n    return {\n      ipa: st.ipa,\n      loadError: st.loadError,\n      hasResult: (res && syls.length) ? true : '',\n      name: syls.map((s) => s.char).join(''),\n      readingLine: res ? res.syllables.map((s) => s.target).join(' · ') : '',\n      totalText: res ? 'Total distance ' + res.total.toFixed(2) : '',\n      perCharText: res ? 'Per character ' + (res.total / n).toFixed(2) : '',\n      totalChipStyle: res ? this.chip(res.total / n) : '',\n      syls,\n      headerStyle: st.wide\n        ? 'display: grid; grid-template-columns: ' + COLS + '; gap: var(--space-4); padding: 0 0 var(--space-2); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700); border-bottom: 1px solid var(--color-text);'\n        : 'display: none;',\n      examples: EXAMPLES.map((e) => ({ ...e, onPick: () => this.setIpa(e.ipa) })),\n      onInput: (e) => this.setIpa(e.target.value),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
